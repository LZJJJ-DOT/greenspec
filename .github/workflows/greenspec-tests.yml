name: GreenSpec Tests

on:
  push:
    branches:
      - main
      - master
    paths:
      - "greenspec/**"
      - "multi_agents/**"
      - "tests/test_applicability_judge.py"
      - "tests/test_evidence_verifier.py"
      - "tests/test_greenspec_calculation_basis.py"
      - "tests/test_greenspec_evaluator.py"
      - "tests/test_medium_priority_regressions.py"
      - "tests/test_output_contracts.py"
      - "tests/test_web_source_classification.py"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "pyproject.toml"
      - ".github/workflows/greenspec-tests.yml"

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: greenspec-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  greenspec-tests:
    name: GreenSpec deterministic tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run GreenSpec tests
        run: |
          python -m pytest \
            tests/test_applicability_judge.py \
            tests/test_evidence_verifier.py \
            tests/test_greenspec_calculation_basis.py \
            tests/test_greenspec_evaluator.py \
            tests/test_medium_priority_regressions.py \
            tests/test_output_contracts.py \
            tests/test_web_source_classification.py \
            -q